<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏗 建設・再開発プロジェクト（6都府県）</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f5; color: #1f2937; margin: 0; padding: 16px; }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .tab { border: 1px solid #d1d5db; background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; color: #374151; }
  .tab.active { background: #145343; color: #fff; border-color: #145343; font-weight: 600; }
  .source-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .source-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #145343; padding-bottom: 8px; margin-bottom: 8px; }
  .source-name { font-weight: 700; font-size: 15px; }
  .source-count { font-size: 12px; color: #6b7280; }
  .item { display: block; padding: 10px 0; border-bottom: 1px solid #f3f4f6; text-decoration: none; color: inherit; }
  .item:last-child { border-bottom: none; }
  .item:hover .item-title { color: #145343; text-decoration: underline; }
  .item-title { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .item-meta { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; margin-top: 4px; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
  .badge-en { background: #e0f2fe; color: #0369a1; }
  .badge-jp { background: #f3f4f6; color: #4b5563; }
</style>
</head>
<body>
<div class="container">
  <h1>🏗 建設・再開発プロジェクト（6都府県）</h1>
  <div class="sub">更新: 2026-11-28 19:46 JST ・ 6都府県 計0件</div>
  <div class="tabs"><button class="tab active" onclick="filterPref('ALL', this)">すべて</button><button class="tab" onclick="filterPref('ACTIVE', this)">計画中・建設中のみ</button><button class="tab" onclick="filterPref('大阪府', this)">大阪府 (0)</button><button class="tab" onclick="filterPref('兵庫県', this)">兵庫県 (0)</button><button class="tab" onclick="filterPref('京都府', this)">京都府 (0)</button><button class="tab" onclick="filterPref('神奈川県', this)">神奈川県 (0)</button><button class="tab" onclick="filterPref('東京都', this)">東京都 (0)</button><button class="tab" onclick="filterPref('愛知県', this)">愛知県 (0)</button></div>
  
        <section class="source-card" data-pref="大阪府">
          <div class="source-header"><span class="source-name">大阪府</span><span class="source-count">0件</span></div>
          <div class="items"></div>
        </section>
        <section class="source-card" data-pref="兵庫県">
          <div class="source-header"><span class="source-name">兵庫県</span><span class="source-count">0件</span></div>
          <div class="items"></div>
        </section>
        <section class="source-card" data-pref="京都府">
          <div class="source-header"><span class="source-name">京都府</span><span class="source-count">0件</span></div>
          <div class="items"></div>
        </section>
        <section class="source-card" data-pref="神奈川県">
          <div class="source-header"><span class="source-name">神奈川県</span><span class="source-count">0件</span></div>
          <div class="items"></div>
        </section>
        <section class="source-card" data-pref="東京都">
          <div class="source-header"><span class="source-name">東京都</span><span class="source-count">0件</span></div>
          <div class="items"></div>
        </section>
        <section class="source-card" data-pref="愛知県">
          <div class="source-header"><span class="source-name">愛知県</span><span class="source-count">0件</span></div>
          <div class="items"></div>
        </section>
</div>
<script>
function filterPref(key, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.source-card').forEach(card => {
    if (key === 'ALL') {
      card.style.display = 'block';
      card.querySelectorAll('.item').forEach(it => it.style.display = 'block');
    } else if (key === 'ACTIVE') {
      card.style.display = 'block';
      let vis = 0;
      card.querySelectorAll('.item').forEach(it => {
        const show = it.dataset.active === '1';
        it.style.display = show ? 'block' : 'none';
        if (show) vis++;
      });
      if (vis === 0) card.style.display = 'none';
    } else {
      card.style.display = (card.dataset.pref === key) ? 'block' : 'none';
      card.querySelectorAll('.item').forEach(it => it.style.display = 'block');
    }
  });
}
</script>
</body>
</html>
